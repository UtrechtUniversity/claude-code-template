[project]
name = "app"
version = "0.0.1"
description = "Agent-driven coding template — FastAPI + SQLAlchemy backend example."
requires-python = ">=3.12,<3.13"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  # psycopg2-binary is used by Alembic only — Alembic runs migrations
  # synchronously and does not support asyncpg.
  "psycopg2-binary>=2.9",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-testmon>=2.1",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Single session loop so the session-scoped async_engine's pooled
# connections stay valid across tests (asyncpg binds them to a loop).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that hit a real database or are otherwise too slow for the per-PR fast tier. Run nightly; pulled into PR via path triggers.",
]
