<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="The LSTM forget gate moved out of the model and into your hands; emerging tech ahead" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<marker id="aGray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11 Z" fill="#94A3B8"/></marker>
<marker id="aTeal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11 Z" fill="#0D9488"/></marker>
<marker id="aCoral" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="10" refY="6" orient="auto"><path d="M1,1 L12,6 L1,11 Z" fill="#D8542F"/></marker>
</defs>

