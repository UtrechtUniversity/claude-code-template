<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 320" role="img" aria-label="Attention connects every word directly and equally; an RNN passes a fading signal down a chain">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
.t{font-size:13px;font-weight:600;fill:#1f2430;}
.lab{font-size:15px;font-weight:700;fill:#1f2430;}
.s{font-size:12px;fill:#5b6170;}
.w{font-size:12px;font-weight:600;fill:#993C1D;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1D9E75" stop-opacity="0.9"/>
<stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
</linearGradient>
</defs>

<text class="lab" x="52" y="62">Attention</text>
