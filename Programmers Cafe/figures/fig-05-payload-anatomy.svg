<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 510" role="img" aria-label="One request payload: fixed prefix plus interleaved turns and tool results filling the context window">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
.t{font-size:13px;font-weight:600;fill:#1f2430;}
.s{font-size:12px;fill:#5b6170;}
</style>

<rect x="120" y="60"  width="180" height="40" fill="#F2F1EC" stroke="#B0ADA2" stroke-width="0.5"/>
<rect x="120" y="100" width="180" height="18" fill="#EEEDFE" stroke="#6B5FD0" stroke-width="0.5"/>
<rect x="120" y="118" width="180" height="26" fill="#DCF2EA" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="120" y="144" width="180" height="80" fill="#FAEEDA" stroke="#B5791F" stroke-width="0.5"/>
<rect x="120" y="224" width="180" height="22" fill="#DCF2EA" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="120" y="246" width="180" height="60" fill="#FAEEDA" stroke="#B5791F" stroke-width="0.5"/>
<rect x="120" y="306" width="180" height="20" fill="#DCF2EA" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="120" y="326" width="180" height="18" fill="#EEEDFE" stroke="#6B5FD0" stroke-width="0.5"/>

<rect x="120" y="60" width="180" height="400" rx="4" fill="none" stroke="#888780" stroke-width="1"/>
<line x1="120" y1="344" x2="300" y2="344" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>

<rect x="340" y="64"  width="14" height="14" fill="#F2F1EC" stroke="#B0ADA2" stroke-width="0.5"/>
<text class="s" x="360" y="71" dominant-baseline="central">Fixed prefix (system + tools + CLAUDE.md)</text>
<rect x="340" y="88"  width="14" height="14" fill="#EEEDFE" stroke="#6B5FD0" stroke-width="0.5"/>
<text class="s" x="360" y="95" dominant-baseline="central">Your messages</text>
<rect x="340" y="112" width="14" height="14" fill="#DCF2EA" stroke="#0F6E56" stroke-width="0.5"/>
<text class="s" x="360" y="119" dominant-baseline="central">Opus responses (incl. code)</text>
<rect x="340" y="136" width="14" height="14" fill="#FAEEDA" stroke="#B5791F" stroke-width="0.5"/>
<text class="s" x="360" y="143" dominant-baseline="central">Tool results (file reads, output)</text>

<line x1="300" y1="184" x2="430" y2="184" stroke="#aaa" stroke-width="0.75" stroke-dasharray="3 3"/>
<circle cx="300" cy="184" r="2" fill="#888780"/>
<text class="t" x="436" y="184" dominant-baseline="central">file reads &#8212; usually the bulk</text>

<line x1="300" y1="276" x2="430" y2="276" stroke="#aaa" stroke-width="0.75" stroke-dasharray="3 3"/>
<circle cx="300" cy="276" r="2" fill="#888780"/>
<text class="s" x="436" y="276" dominant-baseline="central">command output &amp; logs</text>

<line x1="300" y1="402" x2="430" y2="402" stroke="#aaa" stroke-width="0.75" stroke-dasharray="3 3"/>
<circle cx="300" cy="402" r="2" fill="#888780"/>
<text class="s" x="436" y="395" dominant-baseline="central">headroom &#8212; next turns</text>
<text class="s" x="436" y="411" dominant-baseline="central">fill this, then the limit</text>

<text class="s" x="210" y="486" text-anchor="middle">The whole filled stack is re-sent to Opus every turn &#8212; and it keeps growing</text>
</svg>
