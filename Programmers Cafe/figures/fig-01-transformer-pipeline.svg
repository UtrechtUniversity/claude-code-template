<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 620 520" role="img" aria-label="Transformer pipeline from input text to next-token prediction">
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
.t{font-size:14px;font-weight:600;fill:#1f2430;}
.s{font-size:12px;fill:#5b6170;}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="180" y="30" width="260" height="52" rx="8" fill="#F2F1EC" stroke="#B0ADA2"/>
<text class="t" x="310" y="51" text-anchor="middle">Input text</text>
<text class="s" x="310" y="69" text-anchor="middle">raw words to process</text>
<line x1="310" y1="82" x2="310" y2="102" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="180" y="104" width="260" height="52" rx="8" fill="#F2F1EC" stroke="#B0ADA2"/>
<text class="t" x="310" y="125" text-anchor="middle">Tokenization</text>
<text class="s" x="310" y="143" text-anchor="middle">split into tokens</text>
<line x1="310" y1="156" x2="310" y2="176" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="180" y="178" width="260" height="52" rx="8" fill="#F2F1EC" stroke="#B0ADA2"/>
<text class="t" x="310" y="199" text-anchor="middle">Embeddings + position</text>
<text class="s" x="310" y="217" text-anchor="middle">tokens become vectors</text>
<line x1="310" y1="230" x2="310" y2="250" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="140" y="252" width="340" height="152" rx="12" fill="#EEEDFE" stroke="#6B5FD0"/>
<text class="t" x="310" y="276" text-anchor="middle">Transformer block</text>
<text class="s" x="310" y="294" text-anchor="middle">x N stacked layers</text>
<rect x="170" y="308" width="280" height="38" rx="8" fill="#DCF2EA" stroke="#0F6E56"/>
<text class="t" x="310" y="327" text-anchor="middle" fill="#0F6E56" dominant-baseline="central">Self-attention</text>
<rect x="170" y="354" width="280" height="38" rx="8" fill="#FAEEDA" stroke="#B5791F"/>
<text class="t" x="310" y="373" text-anchor="middle" fill="#8A5B16" dominant-baseline="central">Feed-forward network</text>
<line x1="310" y1="404" x2="310" y2="424" stroke="#6b6b6b" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="180" y="426" width="260" height="52" rx="8" fill="#F2F1EC" stroke="#B0ADA2"/>
<text class="t" x="310" y="447" text-anchor="middle">Next-token prediction</text>
<text class="s" x="310" y="465" text-anchor="middle">probabilities over vocabulary</text>

<path d="M180 452C70 452,70 56,180 56" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="s" x="310" y="502" text-anchor="middle">Re-run once per generated token — the output feeds back as new input</text>
</svg>
